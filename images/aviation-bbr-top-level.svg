  <text x="40" y="57" fill="#183349" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="start">AVIATION BBR</text>
  <text x="40" y="91" fill="#526b7e" font-size="23" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="start">Top-level flight instrument and aircraft-system recorder</text>
  <text x="1760" y="54" fill="#087e8b" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="end">PROPOSED ARCHITECTURE</text>
  <text x="1760" y="84" fill="#526b7e" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="end">8 November 2026  |  Instrument data only</text>
