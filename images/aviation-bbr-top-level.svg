<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title description">
  <title id="title">Aviation BBR: proposed top-level instrument recorder</title>
  <desc id="description">Aircraft instrument data enters acquisition, scheduled queues and a chunk framer inside a MAX 10 10M50 FPGA. The storage controller writes mirrored F-RAM staging and a 32 GiB raw NAND archive in a proposed crash-survivable memory unit. External time, recording control, health supervision, host readout and independent media extraction are shown. This is a design proposal, not implemented hardware.</desc>
